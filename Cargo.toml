[package]
name = "laya-rs2"
version = "0.4.1"
edition = "2021"
default-run = "laya"
description = "Rust (candle) inference for Laya's typed-decision (choice/score/noul) decision engine"
license = "Apache-2.0"
repository = "https://github.com/apiplant/laya-rs"
readme = "README.md"
keywords = ["laya", "candle", "inference", "nlp", "rl"]
categories = ["science", "text-processing", "command-line-utilities"]

[[bin]]
name = "laya"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "laya"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

# Uses the optional `candle-flash-attn` dep (feature `flash-attn`, CUDA): it
# must not be built by a plain `cargo test`/`cargo build` on a box without
# the feature.
[[example]]
name = "bench_ops"
required-features = ["flash-attn"]

[features]
# `cli` and `server` are on by default so `cargo install` gives the full `laya` binary. A library
# dependency that only wants the engine should turn them off, which drops clap, ntex and tokio:
#   laya-rs2 = { version = "...", default-features = false }
default = ["cli", "server"]
# Command-line parsing for the `laya` binary.
cli = ["dep:clap"]
# The HTTP server (`laya::server`, `laya serve`).
server = ["dep:ntex", "dep:tokio", "dep:ntex-http"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
flash-attn = ["cuda", "dep:candle-flash-attn"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
# NOTE: deliberately NOT enabling serde_json's `preserve_order` feature
# crate-wide. It flips every `Value::Object` from a BTreeMap (sorted keys) to
# an IndexMap (input order), which changes the prompt text for object states
# in the inference pipeline (schema::serialize_state -> serde_json::to_string)
# and breaks the episode-prefix tokenization tests in rlcd_training_loop.rs.
# The Jev protocol layer (src/server/request) instead captures question key
# order explicitly at the parse boundary (a first `Value` pass plus a
# serde-ignored second pass that only reads the key sequence), so insertion
# order is preserved without mutating crate-wide serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
rand = "0.8"
rand_distr = "0.4"
candle-flash-attn = { version = "0.9", optional = true }
half = "2"
# `onig` (this version's default regex backend for the `Split` pre-tokenizer
# pattern) links a C library (Oniguruma) and cannot target
# wasm32-unknown-unknown. Cargo unions a dependency's features across every
# target it could possibly be built for rather than resolving them per-target
# on stable, so `onig` for native + a wasm-only backend for wasm can't coexist
# as a target-gated split of the same dependency — confirmed by trying it (the
# wasm32 build still pulled in and failed to link `onig`). `unstable_wasm`
# (this crate's actual feature name for the pure-Rust `fancy-regex` backend,
# despite the name — it's not gated to wasm builds, just introduced for them)
# is used for every target instead, matching what gliner-rs does with its own
# (newer) tokenizers version, which ships this way in production for both its
# CLI and its wasm build.
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Lightweight statistical language-ID, used by `router` to pick english vs
# multilingual checkpoints. Not needed in the browser demo (the model picker
# chooses the checkpoint directly) and its wasm32 compatibility is unverified,
# so it's native-only. Picked over `lingua` (which was here first) because
# `lingua`'s default build embeds one n-gram model per supported language —
# ~300MB across all 75 — while `whichlang` ships one small fixed-size weight
# table (~1MB) for its 16 languages, which is all the router needs since it
# only ever calls this on text that's already dominant-Latin-script.
whichlang = "0.1"
# Checkpoint downloads (see `download`). The browser demo fetches with the
# JS `fetch` API instead (website/src/lib/laya.ts), so this is native-only.
ureq = "2"
# Jev protocol server (src/server/): ntex web server (its own worker threads +
# graceful signal handling; `tokio` selects the runtime driver). Serial model
# execution sits behind an async Mutex + bounded admission Semaphore (tokio's
# `sync` primitives are runtime-agnostic) and the synchronous candle forward is
# offloaded with `ntex::rt::spawn_blocking`. Native-only, like the server
# module itself; the wasm32 build never links these (guarded by cfg).
ntex = { version = "3.12", features = ["tokio"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
# ntex 3.12.3 does not compile against ntex-http 1.3.0 (HeaderMap no longer
# implements FromIterator, which ntex's h2 client relies on), yet its own
# requirement is `>=1.2.0`; hold the resolver on 1.2.x until ntex catches up.
ntex-http = { version = "~1.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
# The flash-attn build statically links candle-kernels/candle-flash-attn's
# CUTLASS-templated CUDA code, which carries a lot of debug info; stripping
# is what packaging/pacman/PKGBUILD(-flash-attn) already assume is happening
# (they skip makepkg's own strip pass on that claim).
strip = true

# The server's tests need the `server` feature (and the binary, for serve_cli).
[[test]]
name = "jev_conformance"
required-features = ["server"]

[[test]]
name = "request_schema"
required-features = ["server"]

[[test]]
name = "router_endpoints"
required-features = ["server"]

[[test]]
name = "server_response"
required-features = ["server"]

[[test]]
name = "serve_cli"
required-features = ["cli", "server"]
