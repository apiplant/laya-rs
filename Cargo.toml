[package]
name = "laya"
version = "0.1.0"
edition = "2021"
default-run = "laya"

[[bin]]
name = "laya"
path = "src/main.rs"

[lib]
name = "laya"
path = "src/lib.rs"

[dependencies]
candle-core = "0.8"
candle-nn = "0.8"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_distr = "0.4"
lingua = "1.8.0"

[profile.release]
opt-level = 3
lto = true
